[program:mines-queue-worker]
command=php /var/www/html/artisan queue:work --queue=default,notifications,reports --sleep=3 --tries=3 --timeout=90
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/mines/queue-worker.log
stopsignal=TERM

[program:mines-integrations-worker]
command=php /var/www/html/artisan queue:work --queue=integrations --sleep=5 --tries=1 --timeout=180
process_name=%(program_name)s_%(process_num)02d
numprocs=1
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/mines/integrations-worker.log
stopsignal=TERM
