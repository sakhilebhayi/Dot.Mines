apiVersion: v1
kind: Service
metadata:
  name: mines-app
  namespace: mines
  labels:
    app: mines-app
spec:
  selector:
    app: mines-app
    component: web
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: mines-reverb
  namespace: mines
  labels:
    app: mines-reverb
spec:
  selector:
    app: mines-reverb
    component: websocket
  ports:
    - name: ws
      protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
