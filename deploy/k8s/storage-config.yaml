apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mines-storage-pvc
  namespace: mines
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc    # AWS EFS CSI driver — replace with your cloud provider's RWX class
  resources:
    requests:
      storage: 50Gi
---
# Non-sensitive runtime config (safe to commit)
apiVersion: v1
kind: ConfigMap
metadata:
  name: mines-config
  namespace: mines
data:
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "https://mines.infodot.co.za"
  DB_CONNECTION: "mysql"
  DB_PORT: "3306"
  REDIS_PORT: "6379"
  SESSION_DRIVER: "redis"
  CACHE_STORE: "redis"
  QUEUE_CONNECTION: "redis"
  BROADCAST_CONNECTION: "reverb"
  LOG_CHANNEL: "stack"
  LOG_STACK: "daily,sentry"
  LOG_LEVEL: "warning"
  PULSE_ENABLED: "true"
  SENTRY_TRACES_SAMPLE_RATE: "0.1"
