name: CD – Build, Push & Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Run tests before building the image
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests (pre-deploy gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.16'
          extensions: pdo_sqlite, sqlite3, bcmath, gd, zip, mbstring, intl, pcntl

      - name: Disable Xdebug
        run: sudo phpdismod xdebug || true

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Build assets
        run: |
          if [ -f package-lock.json ]; then npm ci --silent; fi
          npm run build

      - name: Run test suite
        run: php artisan test --compact
        env:
          APP_ENV: testing
          APP_KEY: base64:TestKeyForCIOnly00000000000000000000000=
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          QUEUE_CONNECTION: sync
          CACHE_STORE: array
          SESSION_DRIVER: array
          BROADCAST_CONNECTION: "null"
          MAIL_MAILER: array

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Build and push Docker image to GHCR
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      short_sha: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # 3a. Deploy to Staging (on every push to main)
  # ────────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.mines.infodot.co.za
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Roll out new image (staging)
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:sha-$(git rev-parse --short HEAD)"
          kubectl -n mines-staging set image deployment/mines-app app=${IMAGE}
          kubectl -n mines-staging set image deployment/mines-queue queue=${IMAGE}
          kubectl -n mines-staging set image deployment/mines-scheduler scheduler=${IMAGE}
          kubectl -n mines-staging set image deployment/mines-reverb reverb=${IMAGE}

      - name: Wait for rollout
        run: |
          kubectl -n mines-staging rollout status deployment/mines-app --timeout=5m
          kubectl -n mines-staging rollout status deployment/mines-queue --timeout=3m

      - name: Run smoke test
        run: |
          sleep 10
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://staging.mines.infodot.co.za/up || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test FAILED — /up returned $STATUS"
            exit 1
          fi
          echo "Smoke test passed (HTTP $STATUS)"

      - name: Notify Sentry of staging release
        run: |
          if [ -n "${{ secrets.SENTRY_AUTH_TOKEN }}" ]; then
            curl -X POST "https://sentry.io/api/0/organizations/${{ secrets.SENTRY_ORG }}/releases/" \
              -H "Authorization: Bearer ${{ secrets.SENTRY_AUTH_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"version":"'"$(git rev-parse --short HEAD)"'","projects":["mines"]}'
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # 3b. Deploy to Production (on version tags only — requires manual approval)
  # ────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mines.infodot.co.za
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Roll out new image (production)
        run: |
          TAG="${{ github.ref_name }}"
          IMAGE="ghcr.io/${{ github.repository }}:${TAG}"
          kubectl -n mines set image deployment/mines-app app=${IMAGE}
          kubectl -n mines set image deployment/mines-queue queue=${IMAGE}
          kubectl -n mines set image deployment/mines-scheduler scheduler=${IMAGE}
          kubectl -n mines set image deployment/mines-reverb reverb=${IMAGE}

      - name: Wait for rollout
        run: |
          kubectl -n mines rollout status deployment/mines-app --timeout=10m
          kubectl -n mines rollout status deployment/mines-queue --timeout=5m

      - name: Run production smoke test
        run: |
          sleep 15
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://mines.infodot.co.za/up || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "Production smoke test FAILED — rolling back"
            kubectl -n mines rollout undo deployment/mines-app
            exit 1
          fi
          echo "Production smoke test passed (HTTP $STATUS)"

      - name: Create Sentry production release
        run: |
          if [ -n "${{ secrets.SENTRY_AUTH_TOKEN }}" ]; then
            curl -X POST "https://sentry.io/api/0/organizations/${{ secrets.SENTRY_ORG }}/releases/" \
              -H "Authorization: Bearer ${{ secrets.SENTRY_AUTH_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"version":"'"${{ github.ref_name }}"'","projects":["mines"],"environment":"production"}'
          fi
