name: Server Logs

# Read-only: tail the newest Laravel log so failures are diagnosable
# without shell access. Fixed command on purpose -- this workflow must
# never become a general remote shell.
on:
  workflow_dispatch:

jobs:
  logs:
    name: Tail latest Laravel log
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Tail log
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}" \
              'bash -s' <<'LOGS'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          latest=$(ls -1t storage/logs/*.log 2>/dev/null | head -1 || true)
          if [ -z "$latest" ]; then
            echo "No log files in storage/logs."
            exit 0
          fi
          echo "== $latest (last 100 non-scheduler lines)"
          grep -vE "Running \['artisan'|artisan' integrations:sync-due|schedule:run" "$latest" | tail -100
          LOGS

      - name: Dot.Memory outbox status
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}" \
              'bash -s' <<'STATUS'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          echo "== memory:status (read-only)"
          php artisan memory:status
          STATUS

      - name: Queue evidence
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}" \
              'bash -s' <<'QUEUE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          echo "== memory:status (read-only)"
          echo "== jobs by queue and class (pending rows, reserved rows, oldest/newest available_at)"
php artisan tinker --execute 'use Illuminate\Support\Facades\DB; $now = now()->getTimestamp(); $rows = DB::table("jobs")->get(); $g = []; foreach ($rows as $r) { $name = json_decode($r->payload, true)["displayName"] ?? "?"; $k = $r->queue."|".$name; $g[$k] ??= ["n"=>0,"reserved"=>0,"min"=>PHP_INT_MAX,"max"=>0,"attempts_max"=>0]; $g[$k]["n"]++; if ($r->reserved_at) $g[$k]["reserved"]++; $g[$k]["min"] = min($g[$k]["min"], $r->available_at); $g[$k]["max"] = max($g[$k]["max"], $r->available_at); $g[$k]["attempts_max"] = max($g[$k]["attempts_max"], $r->attempts); } ksort($g); foreach ($g as $k => $v) { printf("%-55s n=%-4d reserved=%-3d oldest_available=%+ds newest_available=%+ds attempts_max=%d\n", $k, $v["n"], $v["reserved"], $v["min"]-$now, $v["max"]-$now, $v["attempts_max"]); } printf("total=%d\n", count($rows));' 2>&1 | tail -40
echo "== failed_jobs last 24h by class"
php artisan tinker --execute 'use Illuminate\Support\Facades\DB; $c = []; foreach (DB::table("failed_jobs")->where("failed_at", ">=", now()->subDay())->get() as $f) { $n = json_decode($f->payload, true)["displayName"] ?? "?"; $c[$n] = ($c[$n] ?? 0) + 1; } arsort($c); foreach ($c as $n => $k) printf("%-55s %d\n", $n, $k); printf("total=%d\n", array_sum($c));' 2>&1 | tail -15
          QUEUE

      - name: Scheduler evidence
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}" \
              'bash -s' <<'SCHED'
          set -uo pipefail
          cd "$DEPLOY_PATH"
          echo "== schedule:list (memory entries)"
          php artisan schedule:list 2>&1 | grep -i "memory" || echo "(no memory entries in the schedule)"
          echo "== crontab lines mentioning artisan"
          crontab -l 2>/dev/null | grep artisan || echo "(none visible to this user)"
          echo "== scheduler output lines about memory:flush (newest 15, all log files)"
          grep -h "memory:flush" storage/logs/*.log 2>/dev/null | tail -15 || true
          echo "== last 5 scheduler 'Running' lines of any kind"
          grep -h "Running \['artisan'" storage/logs/*.log 2>/dev/null | tail -5 || true
          SCHED
