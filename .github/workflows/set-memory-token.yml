name: Provision Memory Token

# Upserts DOT_MEMORY_URL and DOT_MEMORY_TOKEN in the production .env over
# the same pinned SSH path deploy.yml uses, then rebuilds the config cache
# so the running app picks them up. Same recipe as set-guardian-token.yml.
# Run AFTER the deploy that ships config/services.php's memory block.
# Rotate by updating the DOT_MEMORY_TOKEN repository secret and re-running.
#
# The token is a Dot.Memory service token: on Dot.Memory, run
# provision-service-token.yml with service=dot-mines and the sha256 of a
# locally generated plaintext; the bearer value is "<id>|<plaintext>".
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "provision" to confirm writing DOT_MEMORY_* to production'
        required: true

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  provision:
    name: Set DOT_MEMORY_* on mines.infodot.co.za
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5

    steps:
      - name: Refuse unconfirmed runs
        if: ${{ github.event.inputs.confirm != 'provision' }}
        run: |
          echo '::error::Confirmation input was not "provision" -- aborting.'
          exit 1

      - name: Validate the token secret
        env:
          DOT_MEMORY_TOKEN: ${{ secrets.DOT_MEMORY_TOKEN }}
        run: |
          # A Sanctum bearer is "<id>|<64 hex>". Anything else (an extra
          # pasted line, quotes, spaces) must never reach the server's shell.
          if [ -z "$DOT_MEMORY_TOKEN" ]; then
            echo '::error::Repository secret DOT_MEMORY_TOKEN is not set.'
            exit 1
          fi
          if ! printf '%s' "$DOT_MEMORY_TOKEN" | grep -Eq '^[0-9]+\|[0-9a-f]{64}$'; then
            echo '::error::DOT_MEMORY_TOKEN is not of the form <id>|<64 hex chars> (it may contain a stray line or quote). Set it again with: gh secret set DOT_MEMORY_TOKEN --repo sakhilebhayi/Dot.Mines --body "<id>|<plaintext>"'
            exit 1
          fi
          echo "TOKEN_B64=$(printf '%s' "$DOT_MEMORY_TOKEN" | base64 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Provision token
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              -p "${{ secrets.DEPLOY_PORT || '22' }}" \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}" \
              DEPLOY_PHP="${{ secrets.DEPLOY_PHP || 'php' }}" \
              DOT_MEMORY_URL="${{ secrets.DOT_MEMORY_URL || 'https://memory.infodot.co.za' }}" \
              TOKEN_B64="$TOKEN_B64" \
              'bash -s' <<'PROVISION'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          PHP="${DEPLOY_PHP:-php}"
          # Base64 on the wire: only [A-Za-z0-9+/=] crosses the SSH command
          # line, so no token character can ever be parsed as shell.
          DOT_MEMORY_TOKEN="$(printf '%s' "$TOKEN_B64" | base64 -d)"

          # Idempotent upsert: drop any existing DOT_MEMORY_* lines, append
          # the current ones. Never echo the token.
          touch .env
          grep -v -e '^DOT_MEMORY_URL=' -e '^DOT_MEMORY_TOKEN=' .env > .env.memory-tmp || true
          printf 'DOT_MEMORY_URL=%s\n' "$DOT_MEMORY_URL" >> .env.memory-tmp
          printf 'DOT_MEMORY_TOKEN=%s\n' "$DOT_MEMORY_TOKEN" >> .env.memory-tmp
          mv .env.memory-tmp .env

          # Rebuild the cached config so the running app reads the new values.
          $PHP artisan config:cache
          echo "DOT_MEMORY_URL and DOT_MEMORY_TOKEN provisioned and config cache rebuilt."
          PROVISION
