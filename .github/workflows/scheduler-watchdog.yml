name: Scheduler Watchdog

# The alarm that reaches a person. Every 15 minutes, outside the server,
# ask the guardian health endpoint whether the scheduler and the queue are
# alive and FAIL this run if not; GitHub emails the owner on a failed
# scheduled run. The guardian in Dot.Brain detects the same thing and
# opens an issue, but an issue nobody opens is silence (2026-08-31 to
# 2026-10-16). Read-only: one GET with the guardian bearer.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  watch:
    name: Scheduler and queue alive
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the guardian health endpoint
        env:
          GUARDIAN_TOKEN: ${{ secrets.GUARDIAN_TOKEN }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          if [ -z "$GUARDIAN_TOKEN" ] || [ -z "$HOST" ]; then
            echo '::error::GUARDIAN_TOKEN or DEPLOY_HOST secret is not set.'; exit 1
          fi
          body="$(mktemp)"
          code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 20 -H "Accept: application/json" -H "Authorization: Bearer $GUARDIAN_TOKEN" "https://$HOST/guardian/health" || echo 000)
          echo "GET /guardian/health -> $code"
          if [ "$code" != "200" ]; then
            echo "::error::Health endpoint answered HTTP $code (503 means the guardian token is not configured on the server; 401/403 means the secret and the server disagree)."
            exit 1
          fi
          for check in scheduler queue; do
            status=$(jq -r ".checks.$check.status // \"missing\"" "$body")
            message=$(jq -r ".checks.$check.message // \"\"" "$body")
            echo "$check: $status $message"
            if [ "$status" != "healthy" ]; then
              echo "::error::$check is $status: $message"
              failed=1
            fi
          done
          [ "${failed:-0}" = "0" ]
