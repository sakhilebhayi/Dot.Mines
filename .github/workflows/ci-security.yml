name: CI - Security & Static Analysis

on:
  push:
    branches: [ '**' ]
  pull_request:

jobs:
  tests:
    name: PHPUnit test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.16'
          extensions: pdo_sqlite, sqlite3, bcmath, gd, zip, mbstring, intl, pcntl

      - name: Disable Xdebug if present
        run: |
          if php -m | grep -q "xdebug"; then
            sudo phpdismod xdebug || true
          fi

      - name: Install composer deps
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install Node dependencies & build assets
        run: |
          if [ -f package-lock.json ]; then npm ci --silent; fi
          npm run build

      - name: Run tests
        run: php artisan test --compact
        env:
          APP_ENV: testing
          APP_KEY: base64:TestKeyForCIOnly00000000000000000000000=
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          QUEUE_CONNECTION: sync
          CACHE_STORE: array
          SESSION_DRIVER: array
          BROADCAST_CONNECTION: "null"
          MAIL_MAILER: array
          FILESYSTEM_DISK: local

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run gitleaks
        uses: zricethezav/gitleaks-action@v1
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  composer-audit:
    name: Composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.16'

      - name: Disable Xdebug if present
        run: |
          if php -m | grep -q "xdebug"; then
            echo "Xdebug found; attempting to disable via phpdismod"
            sudo phpdismod xdebug || true
          fi
          # Fail if Xdebug remains enabled to avoid noisy CI and false positives
          if php -m | grep -q "xdebug"; then
            echo "Xdebug is enabled in the CI image; failing build."; php -i | grep -i xdebug || true; exit 1
          fi
      - name: Install composer deps
        run: composer install --no-interaction --no-progress --prefer-dist
        env:
          BROADCAST_DRIVER: log
      - name: Run composer audit
        run: |
          if ! composer audit --format=plain; then
            echo "Composer audit found security advisories"
            exit 1
          fi

  npm-audit:
    name: NPM audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --silent; elif [ -f package.json ]; then npm install --silent; fi
      - name: Run npm audit
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=moderate || exit 1
          else
            echo "No package.json present, skipping npm audit"
          fi

  semgrep:
    name: Semgrep security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: 'p/ci'

  static-php:
    name: PHP static checks (phpstan/psalm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.16'

      - name: Disable Xdebug if present
        run: |
          if php -m | grep -q "xdebug"; then
            sudo phpdismod xdebug || true
          fi
      - name: Install composer deps
        run: composer install --no-interaction --no-progress --prefer-dist
        env:
          BROADCAST_DRIVER: log
      - name: Run PHPStan if available
        run: |
          if [ -x vendor/bin/phpstan ]; then
            # Run analysis using provided config. If there are errors and no baseline exists,
            # generate a baseline for maintainers to review and fail the job so a baseline PR can be created.
            if vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --no-progress --memory-limit=1G; then
              echo "PHPStan passed";
            else
              if [ ! -f phpstan-baseline.neon ]; then
                echo "PHPStan detected issues; generating baseline phpstan-baseline.neon for review.";
                vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --generate-baseline=phpstan-baseline.neon --no-progress --memory-limit=1G || true
                echo "A baseline was generated at phpstan-baseline.neon. Please review and commit it to suppress existing errors.";
              fi
              exit 1
            fi
          else
            echo "phpstan not installed, skipping";
          fi
      - name: Run Psalm if available
        run: |
          if [ -x vendor/bin/psalm ]; then
            vendor/bin/psalm --show-info=false || exit 1
          else
            echo "psalm not installed, skipping";
          fi

      - name: Run PHPCBF (auto-fix) if available
        run: |
          if [ -x vendor/bin/phpcbf ]; then
            echo "Running phpcbf to apply safe fixes..."
            vendor/bin/phpcbf --standard=PSR12 --extensions=php --ignore=vendor || true
          else
            echo "phpcbf not installed, skipping auto-fix";
          fi

      - name: Run PHPCS and fail on violations
        run: |
          if [ -x vendor/bin/phpcs ]; then
            vendor/bin/phpcs --standard=PSR12 --extensions=php --ignore=vendor || exit 1
          else
            echo "phpcs not installed, skipping";
          fi

      - name: Scan Blade templates for unescaped output
        run: |
          if php -v >/dev/null 2>&1; then
            php artisan scan:blade-unescaped || { echo 'Unescaped Blade outputs found'; exit 1; }
          else
            echo 'PHP not available, skipping blade scan';
          fi

      - name: Semgrep Blade XSS rules
        uses: returntocorp/semgrep-action@v1
        with:
          config: 'p/php'

  code-style:
    name: Laravel Pint code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.16'
          extensions: bcmath, mbstring
      - name: Install composer deps
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run Pint (fail on style violations)
        run: vendor/bin/pint --test

  quality-gate:
    name: Quality Gate (all checks must pass)
    runs-on: ubuntu-latest
    needs: [tests, composer-audit, npm-audit, static-php, code-style]
    if: always()
    steps:
      - name: Evaluate quality gate
        run: |
          declare -A results
          results[tests]="${{ needs.tests.result }}"
          results[composer-audit]="${{ needs.composer-audit.result }}"
          results[npm-audit]="${{ needs.npm-audit.result }}"
          results[static-php]="${{ needs.static-php.result }}"
          results[code-style]="${{ needs.code-style.result }}"
          failed=0
          for job in "${!results[@]}"; do
            if [ "${results[$job]}" != "success" ]; then
              echo "FAILED: $job → ${results[$job]}"
              failed=1
            else
              echo "PASSED: $job"
            fi
          done
          if [ $failed -eq 1 ]; then
            echo ""
            echo "Quality gate failed — one or more required checks did not pass."
            exit 1
          fi
          echo ""
          echo "All quality gates passed."
