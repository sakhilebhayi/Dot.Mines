name: Deploy to Production

# Runs automatically after "CI - Security & Static Analysis" finishes GREEN
# on main (every merge), and manually from the Actions tab (or
# `gh workflow run deploy.yml -f confirm=deploy`) to redeploy the current
# main. A red CI run never deploys: the job's `if` below checks the
# conclusion. Adding "Quality Gate (all checks must pass)" as a required
# status check on main keeps a red PR from being mergeable at all.
on:
  workflow_run:
    workflows: ["CI - Security & Static Analysis"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm deploying main to production'
        required: true

# Never run two deploys at once; a queued deploy waits for the running one.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to mines.infodot.co.za
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    # Only a successful CI run deploys; a manual run must be confirmed.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'deploy')

    # Required repository secrets (Settings -> Secrets and variables -> Actions):
    #   DEPLOY_HOST         e.g. mines.infodot.co.za
    #   DEPLOY_USER         SSH user with write access to the app directory
    #                       (on shared hosting: the hosting account user)
    #   DEPLOY_PATH         absolute app path, e.g. /home/<account>/mines
    #   DEPLOY_SSH_KEY      private key for DEPLOY_USER (a dedicated deploy key,
    #                       not a personal one)
    #   DEPLOY_KNOWN_HOSTS  output of: ssh-keyscan [-p PORT] mines.infodot.co.za
    #                       (pins the host key -- no blind trust-on-first-use)
    #
    # Optional secrets (defaults suit a standard VPS; set them on shared
    # hosting where sudo/systemd do not exist and `php` may be outdated):
    #   DEPLOY_PORT         SSH port (default 22)
    #   DEPLOY_PHP          PHP CLI binary for artisan/composer, e.g.
    #                       /opt/alt/php85/usr/bin/php (default: php)
    #   DEPLOY_COMPOSER     composer binary or "php /path/composer.phar"
    #                       (default: composer)
    #
    # Optional server-side sudoers entry for restarting Reverb with new code
    # (workers restart via `queue:restart` without sudo). Skip on shared
    # hosting -- the step degrades to a warning:
    #   deploy ALL=(root) NOPASSWD: /usr/bin/systemctl restart reverb
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              -p "${{ secrets.DEPLOY_PORT || '22' }}" \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}" \
              DEPLOY_PHP="${{ secrets.DEPLOY_PHP || 'php' }}" \
              DEPLOY_COMPOSER="${{ secrets.DEPLOY_COMPOSER || 'composer' }}" \
              'bash -s' <<'DEPLOY'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          PHP="${DEPLOY_PHP:-php}"
          COMPOSER="${DEPLOY_COMPOSER:-composer}"

          echo "== PHP: $($PHP -v | head -1)"
          echo "== Current release: $(git rev-parse --short HEAD 2>/dev/null || echo 'none (first git deploy)')"

          # Preflight: refuse to deploy while any env file carries template
          # placeholders. A stray .env.production copied from the example
          # once poisoned config:cache with 'your_database_user' and took
          # the site down -- catch that class before touching anything.
          if grep -l "your_database_\|your_app_key\|CHANGE_ME" .env .env.* 2>/dev/null | grep -v ".example" | grep -v ".disabled"; then
            echo "::error::An env file above contains unfilled template placeholders (e.g. your_database_user). Fill it in or remove it, then re-run."
            exit 1
          fi

          # ---- application-folder guard (tolerant: it can never fail the deploy)
          # $DEPLOY_PATH sits inside the docroot (~/<host>/<key>), so without a deny file the web server hands out
          # its database, logs and vendor/ (four other platforms were found doing exactly that on 2026-10-20). This
          # makes sure $DEPLOY_PATH/.htaccess contains `Require all denied`, the same way the App Folder Guard
          # workflow in InfoDot does. The body is a subshell with `set +e`: every outcome, a failed write included,
          # is one log line and the deploy carries on. It skips itself when the folder looks like a docroot (parent
          # is $HOME, or index.php beside artisan with no public/index.php), because denying a docroot takes the
          # site down. It runs BEFORE maintenance mode. Mines tracks its own .htaccess in git, so the
          # `git reset --hard` below restores the tracked text and drops the line again: the guard is called a
          # second time right after the reset. (Untracked, the file would survive the reset as it does elsewhere.)
          guard_app_folder() (
            set +e
            WHEN="$1"
            F="$DEPLOY_PATH/.htaccess"
            # Once the subdomain's document root is <app>/public (the docroot move, InfoDot docs S-2e) the app
            # folder is not served at all, and a deny file in it would block the whole site: do not write one.
            # The host's own answer decides; a marker file is the fallback if the lookup fails.
            APP_REAL="$(cd "$DEPLOY_PATH" 2>/dev/null && pwd -P)" || APP_REAL=""
            CURRENT_DOCROOT="$(uapi --output=json DomainInfo single_domain_data domain=mines.infodot.co.za 2>/dev/null | sed -n 's/.*"documentroot" *: *"\([^"]*\)".*/\1/p' | head -1)"
            if [ -n "$APP_REAL" ] && { [ "$CURRENT_DOCROOT" = "$APP_REAL/public" ] || [ -f "$DEPLOY_PATH/.docroot-is-public" ]; }; then
              echo "== app-folder guard: skipped (the document root is $APP_REAL/public; the app folder is not served)"
              exit 0
            fi
            if [ ! -f "$DEPLOY_PATH/artisan" ]; then echo "== App-folder guard ($WHEN): skipped (no artisan in $DEPLOY_PATH)"; exit 0; fi
            PARENT="$(cd "$(dirname "$DEPLOY_PATH")" 2>/dev/null && pwd -P)"
            HOME_REAL="$(cd "${HOME:-/nonexistent}" 2>/dev/null && pwd -P)"
            if [ -z "$PARENT" ] || [ "$PARENT" = "$HOME_REAL" ]; then
              echo "== App-folder guard ($WHEN): skipped (the app folder is directly in the home folder or its parent is unknown; it may be the docroot)"; exit 0
            fi
            if [ -f "$DEPLOY_PATH/index.php" ] && [ ! -f "$DEPLOY_PATH/public/index.php" ]; then
              echo "== App-folder guard ($WHEN): skipped (index.php beside artisan and no public/index.php: this looks like a docroot)"; exit 0
            fi
            if [ -f "$F" ] && grep -q 'Require all denied' "$F"; then
              echo "== App-folder guard ($WHEN): already present"
            elif [ -f "$F" ]; then
              if git -C "$DEPLOY_PATH" ls-files --error-unmatch .htaccess > /dev/null 2>&1; then
                # tracked: git already holds the original, no copy needed
                if printf '\n# Dot: the application folder is never served.\nRequire all denied\n' >> "$F"; then
                  echo "== App-folder guard ($WHEN): appended to the tracked .htaccess (git holds the original)"
                else
                  echo "::warning::App-folder guard ($WHEN): could not append to $F (deploy continues)"
                fi
              elif cp "$F" "$F.before-guard" && printf '\n# Dot: the application folder is never served.\nRequire all denied\n' >> "$F"; then
                echo "== App-folder guard ($WHEN): appended to the existing .htaccess (original kept as .htaccess.before-guard)"
              else
                echo "::warning::App-folder guard ($WHEN): could not append to $F (deploy continues)"
              fi
            else
              if printf '# Dot: the application folder is never served.\nRequire all denied\n' > "$F"; then
                echo "== App-folder guard ($WHEN): written (new .htaccess)"
              else
                echo "::warning::App-folder guard ($WHEN): could not write $F (deploy continues)"
              fi
            fi
            exit 0
          )
          guard_app_folder "before maintenance mode" || true

          git fetch origin main

          # Maintenance mode only for the risky window (migrations).
          $PHP artisan down --retry=30 || true

          git reset --hard origin/main
          # The reset restored the tracked .htaccess; put the deny line back at once.
          guard_app_folder "after reset" || true
          $COMPOSER install --no-interaction --optimize-autoloader --no-dev

          # Built frontend assets are COMMITTED in public/build -- no npm here.
          $PHP artisan migrate --force

          $PHP artisan config:cache
          $PHP artisan route:cache
          $PHP artisan view:cache
          $PHP artisan event:cache

          # Webroot symlinks: the cPanel docroot is the site directory, not
          # mines/public, so each public asset entry must be linked in.
          # Idempotent (-sfn); sw.js must live at the webroot ROOT for the
          # service worker's scope to cover the whole app.
          for target in build images audio machine-emojis sw.js; do
            ln -sfn "mines/public/${target}" "../${target}"
          done

          # ---- crontab: repair this app's lines, never touch anyone else's ----
          # Rule for this account: the crontab is written only by deploy
          # workflows, each touches only lines carrying its own marker, and a
          # write is verified before and after. 2026-08-31: a pipeline whose read
          # failed installed an EMPTY crontab and silently killed Dot.Mines'
          # scheduler for six weeks. cron runs with a minimal PATH, so lines carry
          # the absolute PHP path and keep their last output in a log file.
          MARK="# dot-mines"
          # One writer at a time on this account: deploys of different apps can
          # coincide and would otherwise race on the single crontab.
          command -v flock > /dev/null || { echo "::error::flock is not installed on the host; crontab writes cannot be serialised"; exit 1; }
          exec 9>"$HOME/.dot-crontab.lock"; flock -w 120 9 || { echo "::error::could not take the crontab lock within 120 s (another deploy is writing the crontab)"; exit 1; }
          PHP_BIN="$(command -v "${PHP:-php}")"
          OLD="$(mktemp)"; NEW="$(mktemp)"; CHK="$(mktemp)"; ERR="$(mktemp)"
          # crontab -l on this host can transiently answer empty (seen 2026-10-16,
          # right after a write, under the lock). A read is trusted only when it
          # is non-empty or the host says there is no crontab; otherwise retry.
          read_crontab() {
            local i
            for i in 1 2 3 4 5; do
              if crontab -l > "$1" 2> "$ERR"; then
                [ -s "$1" ] && return 0
              elif grep -qi "no crontab for" "$ERR"; then
                : > "$1"; return 0
              fi
              sleep 2
            done
            return 1
          }
          if ! read_crontab "$OLD"; then
            echo "::error::crontab -l answered empty or failed five times ($(cat "$ERR")). Refusing to write a crontab I could not read."; exit 1
          fi
          KEY="${MARK#\# dot-}"
          EXPECT_MINE=1
          OTHERS=$(grep -v "$MARK" "$OLD" | grep -c . || true)
          {
            grep -v "$MARK" "$OLD" || true
            echo "* * * * * cd $DEPLOY_PATH && exec $PHP_BIN artisan schedule:run > storage/logs/cron-scheduler.log 2>&1 $MARK"
          } > "$NEW"
          # Runner mode (InfoDot docs/programme R-1): when the account runs the bounded-concurrency cron runner
          # (InfoDot: Cron Runner workflow, "install"), this app's commands go to ~/.dot-cron.d/$KEY.cron and the
          # runner starts them, at most 4 at a time, away from second 0. Its own crontab lines are removed (a migration
          # on deploy). Without the runner the lines above are installed as before.
          if [ -x "$HOME/bin/dot-cron-runner" ] && grep -q '# dot-cron-runner' "$OLD"; then
            CMDS="$(grep -F -- "$MARK" "$NEW" | sed -E 's/^[^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ //; s/ *# dot-[a-z0-9-]*$//' || true)"
            mkdir -p "$HOME/.dot-cron.d"
            if [ -n "$CMDS" ]; then
              printf '%s\n' "$CMDS" > "$HOME/.dot-cron.d/$KEY.cron.tmp" && mv "$HOME/.dot-cron.d/$KEY.cron.tmp" "$HOME/.dot-cron.d/$KEY.cron"
            else
              rm -f "$HOME/.dot-cron.d/$KEY.cron"
            fi
            grep -v -F -- "$MARK" "$NEW" > "$NEW.t" || true; mv "$NEW.t" "$NEW"
            EXPECT_MINE=0
            echo "== runner mode: $(printf '%s' "$CMDS" | grep -c . || true) command(s) written to ~/.dot-cron.d/$KEY.cron, none left in the crontab"
          fi
          crontab "$NEW"
          read_crontab "$CHK" || : > "$CHK"
          AFTER=$(grep -v "$MARK" "$CHK" | grep -c . || true)
          MINE=$(grep -c "$MARK" "$CHK" || true)
          if [ "$AFTER" != "$OTHERS" ] || [ "$MINE" != "$EXPECT_MINE" ]; then
            crontab "$OLD"
            echo "::error::crontab verification failed (other lines before=$OTHERS after=$AFTER, mine=$MINE, expected=$EXPECT_MINE); the previous crontab was restored."; exit 1
          fi
          rm -f "$OLD" "$NEW" "$CHK" "$ERR"; flock -u 9
          echo "== crontab: $MINE line(s) for $MARK installed, $OTHERS other line(s) preserved"

          # Workers pick up new code via the restart signal (no sudo needed).
          $PHP artisan queue:restart

          # Reverb serves compiled code from boot; restart it if sudoers
          # allows (VPS only -- on shared hosting this is expected to warn,
          # and matters only if a Reverb process is actually running there).
          if sudo -n systemctl restart reverb 2>/dev/null; then
            echo "Reverb restarted."
          else
            echo "::warning::Reverb was not restarted (no sudo/systemd here). If a Reverb process runs on this host it is still serving the PREVIOUS release until restarted manually."
          fi

          $PHP artisan up
          echo "== Deployed: $(git rev-parse --short HEAD)"
          DEPLOY

      - name: Health check
        run: |
          sleep 5
          # Hard gate: the app must boot and reach its database.
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ secrets.DEPLOY_HOST }}/ready")
          echo "GET /ready -> ${code}"
          if [ "$code" != "200" ]; then
            echo "::error::Health check failed on /ready (HTTP ${code}). The site may still be in maintenance mode or the release is unhealthy."
            exit 1
          fi
          # Informational: /up/realtime verifies the Reverb PROCESS, which
          # legitimately does not exist on shared hosting -- report, don't gate.
          rt=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ secrets.DEPLOY_HOST }}/up/realtime")
          echo "GET /up/realtime -> ${rt}"
          if [ "$rt" != "200" ]; then
            echo "::warning::Realtime stack reports degraded (HTTP ${rt}) -- expected on hosts without a Reverb process; WebSocket features are unavailable there."
          fi

      - name: Failure notice
        if: failure()
        run: |
          echo '::error::Deploy failed. If it failed during or after migrations, the site may have been left in maintenance mode intentionally -- inspect the server before running `php artisan up`.'

      # The application folder must not answer over HTTP. Public requests only (no SSH, nothing is read), after
      # `php artisan up` and the health check, so it can only turn a finished run red, never leave the site down.
      # It sits after the failure notice so a red probe does not print that notice's "maintenance mode" advice.
      # 200 is a leak; 301/302/403/404 are fine. Found 2026-10-20 serving its database, logs and vendor/ on four
      # other platforms. Only status codes are printed.
      - name: Probe the application folder from outside
        if: ${{ !cancelled() }}
        env:
          SITE_URL: https://mines.infodot.co.za
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -uo pipefail
          KEY="$(basename "$DEPLOY_PATH")"
          [ -n "$KEY" ] && [ "$KEY" != "/" ] || { echo "::error::cannot work out the app folder name; the probe did not run"; exit 1; }
          EXPOSED=0
          UNREACHED=0
          for P in .env .env.bak-secrets artisan composer.json composer.lock database/database.sqlite storage/logs/laravel.log vendor/autoload.php phpunit.xml; do
            CODE=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$SITE_URL/$KEY/$P" || true)
            case "$CODE" in
              200) echo "::error::EXPOSED /$KEY/$P answered 200"; EXPOSED=1 ;;
              000|"") echo "000 /$KEY/$P (no answer)"; UNREACHED=$((UNREACHED + 1)) ;;
              *) echo "$CODE /$KEY/$P" ;;
            esac
          done
          [ "$UNREACHED" -eq 0 ] || echo "::warning::$UNREACHED probe request(s) got no answer; those paths are unverified."
          if [ "$EXPOSED" -ne 0 ]; then
            echo "::error::The application folder is readable over HTTP (database, logs or vendor/ may be downloadable). Run the App Folder Guard workflow in InfoDot (mode apply) or add the deny file by hand, then re-run."
            exit 1
          fi
          echo "== App-folder probe: no sensitive path answered 200 ($((9 - UNREACHED)) of 9 paths verified)."

# registration-kick: touched to force Actions to (re)index this workflow
